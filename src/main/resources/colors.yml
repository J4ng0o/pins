# Все доступные покраски на сервере
# Формат: tint_id: ["#HEX1", "#HEX2", ...]
# Если указан 1 цвет — будет сплошная покраска.
# Если 2 и более — будет градиент по символам.
tints:
  hzmine: ["be87a7", "5493a5", "20282a"]
  blue: ["687d91", "ffffff"]
  rainbow: ["#FF0000", "#FF7F00", "#FFFF00", "#00FF00", "#0000FF", "#4B0082", "#9400D3"]
  sunset: ["#FF4500", "#FF8C00", "#FFD700"]
  lemon: ["eddd48"]

# Покраска по умолчанию (если игрок не выбрал)
# Если пусто — ник будет стандартным
default-tint: ""

# Применять ли покраску в tab-листе
tablist-enabled: true

# Применять ли покраску над головой (nametag)
nametag-enabled: true
