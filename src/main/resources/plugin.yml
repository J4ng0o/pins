commands:
  pins:
    description: Manage emoji prefixes
    usage: /pins [set|clear|give|take|takeall]
    aliases: [p, emoji]
  tints:
    description: Manage name color tints
    usage: /tints [set|clear|give|take|takeall]
    aliases: [t, color]
permissions:
  emojiprefix.admin:
    description: Allows managing emoji prefixes and tints
    default: op
