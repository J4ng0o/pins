name: EmojiPrefix
version: 1.0.0
main: com.example.emojiprefix.EmojiPrefixPlugin
api-version: '1.20'   # Обязательно в кавычках, иначе сервер может прочитать как 1.2

commands:
  pins:
    description: Manage emoji prefixes
    usage: /pins [set|clear|give|take|takeall]
    aliases: [p, emoji]
  tints:
    description: Manage name color tints
    usage: /tints [set|clear|give|take|takeall]
    aliases: [t, color]

permissions:
  emojiprefix.admin:
    description: Allows managing emoji prefixes and tints
    default: op
