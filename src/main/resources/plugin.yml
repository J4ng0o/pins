name: Nots
version: 1.0.0
main: com.example.emojiprefix.EmojiPrefixPlugin
api-version: '1.20'

commands:
  tints:
    description: Manage name color tints
    usage: /tints [set|clear|give|take|takeall]
    aliases: [t, color]

permissions:
  emojiprefix.admin:
    description: Allows managing name color tints
    default: op
